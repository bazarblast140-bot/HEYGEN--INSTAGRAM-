<!doctype html>
<!--
  One carousel slide, 4:5 (1080x1350 at scale 1).

  Static by design: no animation, no frame index. render-slides.js calls
  __slide.load(data) once and screenshots. Keeping it a pure function of the
  payload means the same spec always produces the same PNG, which is what makes
  a re-run safe to publish.

  The Devanagari face is bundled as a variable TTF and pinned by weight, because
  a fallback face silently drops conjuncts (क्ष, त्र, ज्ञ) into tofu and the
  failure only shows up after the image is already on Instagram.
-->
<html lang="hi">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Brand Latin';
    src: url('../../../assets/fonts-ttf/brand-latin.ttf') format('truetype-variations');
    font-weight: 100 900;
  }

  @font-face {
    font-family: 'Noto Devanagari';
    src: url('../../../assets/fonts-ttf/noto-devanagari.ttf') format('truetype-variations');
    font-weight: 100 900;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    /* 1080x1350 is the feed. A story is the same scene at 1080x1920, so the
       stage reads its size from a variable instead of hard-coding the feed. */
    width: var(--stage-w, 1080px); height: var(--stage-h, 1350px);
    background: #000;
    font-family: 'Noto Devanagari', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #stage { position: relative; width: var(--stage-w, 1080px); height: var(--stage-h, 1350px); overflow: hidden; }

  /* Background photo, or a generated field when no photo is supplied. */
  #bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transform: scale(1.04);           /* hides edge seams on off-ratio photos */
  }
  #bg.generated {
    background:
      radial-gradient(120% 80% at 20% 15%, #1e3a5f 0%, transparent 60%),
      radial-gradient(100% 70% at 85% 25%, #4a2545 0%, transparent 55%),
      linear-gradient(160deg, #0b1020 0%, #14161f 55%, #05060a 100%);
  }

  /* Story image window: photo stays in the UPPER part only. Solid black panel
     below carries all copy — no text on photo, no weak gradient under text. */
  #bg.story-bg {
    height: 58%;
    bottom: auto;
    transform: none;
    background-position: center top;
  }
  #scrim.story-scrim {
    top: 0;
    bottom: 42%;
    background: linear-gradient(to bottom, rgba(0,0,0,.15) 0%, rgba(0,0,0,.35) 70%, rgba(0,0,0,.75) 100%);
  }

  /* Legibility floor for feed slides. Near-solid band under text so light
     subjects (glass, snow, sky) never eat the yellow copy. */
  #scrim {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,.45) 0%,
      rgba(0,0,0,.10) 20%,
      rgba(0,0,0,.15) 38%,
      rgba(0,0,0,.70) 52%,
      rgba(0,0,0,.95) 62%,
      rgba(0,0,0,1) 100%
    );
  }

  /* Circular inset portraits */
  .inset {
    position: absolute;
    border-radius: 50%;
    background-size: cover; background-position: center;
    border: 6px solid rgba(255,255,255,.92);
    box-shadow: 0 18px 46px rgba(0,0,0,.6);
  }

  #brand {
    position: absolute; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  #brand.hidden { display: none; }
  #brand .rule { height: 2px; width: 122px; background: linear-gradient(90deg, transparent, var(--brand-ink, #F2F2F2)); opacity: .75; }
  #brand .rule.right { background: linear-gradient(270deg, transparent, var(--brand-ink, #F2F2F2)); }
  #brand .logo { height: 52px; width: 52px; flex: 0 0 52px; }
  #brand .mark {
    font-size: 30px; color: var(--ink, #E8B923); font-weight: 700; font-variation-settings: 'wght' 700;
    white-space: nowrap;
  }

  /* 72px = 6.7% of 1080: the copy box sits inside the 6% safe inset (which also
     covers Instagram's 3:4 grid crop of a 4:5 post). render-slides measures the
     rendered glyphs against that inset before anything is published. */
  #copy { position: absolute; left: 72px; right: 72px; text-align: center; }

  /* Story: solid black lower panel. Image clean on top, all text readable on black. */
  #copy.story-mode {
    left: 0; right: 0;
    background: #000;
    padding: 48px 72px 36px;
  }
  #copy.story-mode #headline {
    text-shadow: none;
  }
  #copy.story-mode #subline {
    text-shadow: none;
  }
  #copy.story-mode #footnote { font-size: 32px; margin-top: 18px; opacity: .72; }
  #copy.story-mode #callout { font-size: 40px; margin-top: 20px; color: #FFD200; }

  #headline, #subline { white-space: pre-line; }

  #headline {
    color: var(--ink, #FFD200);
    font-weight: 900;
    font-variation-settings: 'wght' 900, 'wdth' 82;
    line-height: 1.24;
    text-shadow: 0 4px 26px rgba(0,0,0,.85);
  }
  #subline {
    color: var(--ink, #FFD200);
    font-weight: 800;
    font-variation-settings: 'wght' 800, 'wdth' 85;
    line-height: 1.28;
    text-shadow: 0 4px 22px rgba(0,0,0,.85);
  }
  #footnote {
    color: var(--ink, #fff); opacity: .62;
    font-weight: 500; font-variation-settings: 'wght' 500;
    font-size: 34px; line-height: 1.3;
    margin-top: 26px;
  }
  #callout {
    color: var(--brand-ink, #F2F2F2);
    font-weight: 700; font-variation-settings: 'wght' 700;
    font-size: 46px; line-height: 1.25;
    margin-top: 34px;
  }

  .hidden { display: none; }
</style>
</head>
<body>
  <div id="stage">
    <div id="bg"></div>
    <div id="scrim"></div>
    <div id="insets"></div>
    <div id="brand">
      <span class="rule"></span>
      <img class="logo" alt="">
      <span class="mark"></span>
      <span class="rule right"></span>
    </div>
    <div id="copy">
      <div id="headline"></div>
      <div id="subline"></div>
      <div id="footnote"></div>
      <div id="callout" class="hidden"></div>
    </div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  function fitText(el, { max, min, maxHeight, maxLines = 2 }) {
    const breaks = (el.textContent.match(/\n/g) || []).length;
    const wanted = breaks ? breaks + 1 : maxLines;

    let size = max;
    el.style.fontSize = size + 'px';

    const lines = () => {
      const lh = parseFloat(getComputedStyle(el).lineHeight);
      return Math.round(el.scrollHeight / lh);
    };

    while (size > min && (el.scrollHeight > maxHeight || lines() > wanted)) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
    return size;
  }

  window.__slide = {
    size(w, h) {
      const root = document.documentElement.style;
      root.setProperty('--stage-w', w + 'px');
      root.setProperty('--stage-h', h + 'px');
    },

    load(data) {
      const {
        headline = '',
        subline = '',
        footnote = '',
        brand = '',
        ink,
        logo,
        brandInk,
        background,
        insets = [],
        band = 'bottom',
        bottomInset = 0,
        callout = '',
        tight = false,
      } = data;

      if (ink) document.documentElement.style.setProperty('--ink', ink);
      if (brandInk) document.documentElement.style.setProperty('--brand-ink', brandInk);

      const story = Boolean(bottomInset);

      const bg = $('bg');
      bg.classList.toggle('story-bg', story);
      if (background) {
        bg.style.backgroundImage = `url("${background}")`;
        bg.classList.remove('generated');
      } else {
        bg.classList.add('generated');
      }

      const scrim = $('scrim');
      scrim.classList.toggle('story-scrim', story);

      const copyMode = $('copy');
      copyMode.classList.toggle('story-mode', story);

      $('insets').innerHTML = '';
      for (const it of insets) {
        const d = document.createElement('div');
        d.className = 'inset';
        d.style.left = it.x + 'px';
        d.style.top = it.y + 'px';
        d.style.width = it.size + 'px';
        d.style.height = it.size + 'px';
        d.style.backgroundImage = `url("${it.image}")`;
        $('insets').appendChild(d);
      }

      const brandEl = $('brand');
      const hasBrand = Boolean(String(brand || '').trim());
      brandEl.classList.toggle('hidden', !hasBrand);
      brandEl.querySelector('.mark').textContent = brand || '';
      const logoEl = brandEl.querySelector('.logo');
      if (logo) { logoEl.src = logo; logoEl.style.display = ''; }
      else logoEl.style.display = 'none';

      const h = $('headline');
      const s = $('subline');
      const f = $('footnote');
      h.textContent = headline;
      s.textContent = subline;
      f.textContent = footnote;
      s.classList.toggle('hidden', !subline);
      f.classList.toggle('hidden', !footnote);

      const c = $('callout');
      c.textContent = callout;
      c.classList.toggle('hidden', !callout);

      const cover = band === 'center';
      // tight: the one free re-render after a slide failed the safe-area check.
      const k = tight ? 0.84 : 1;
      const fit = (o) => ({ ...o, max: Math.round(o.max * k), min: Math.round(o.min * k) });
      fitText(h, fit(cover ? { max: 136, min: 74, maxHeight: 470, maxLines: 3 }
                           : { max: 118, min: 66, maxHeight: 250, maxLines: 2 }));
      if (subline) fitText(s, fit({ max: 92, min: 56, maxHeight: 300, maxLines: 2 }));

      const copy = $('copy');
      if (bottomInset) {
        // Story: solid panel starts at 58% height, leave bottomInset for IG UI.
        copy.style.top = '58%';
        copy.style.bottom = bottomInset + 'px';
      } else {
        copy.style.bottom = (cover ? 116 : 104) + 'px';
        copy.style.top = 'auto';
      }
      s.style.marginTop = subline ? '20px' : '0';

      if (hasBrand) {
        const copyTop = copy.getBoundingClientRect().top;
        brandEl.style.top = Math.round(copyTop - 82) + 'px';
      }

      document.body.dataset.ready = '1';
    },

    /**
     * Where the rendered text actually is: the union of every glyph line box
     * (DOM Range rects), per visible text element, in stage pixels. `clipped`
     * lists elements whose content is wider than their own box.
     */
    measure() {
      const out = { boxes: [], clipped: [] };
      const ids = ['headline', 'subline', 'footnote', 'callout'];
      const add = (id, el) => {
        if (!el || el.classList.contains('hidden') || !el.textContent.trim()) return;
        const style = getComputedStyle(el);
        if (style.display === 'none' || style.visibility === 'hidden') return;
        const range = document.createRange();
        range.selectNodeContents(el);
        const rects = [...range.getClientRects()].filter((r) => r.width > 0 && r.height > 0);
        if (!rects.length) return;
        out.boxes.push({
          id,
          left: Math.min(...rects.map((r) => r.left)),
          top: Math.min(...rects.map((r) => r.top)),
          right: Math.max(...rects.map((r) => r.right)),
          bottom: Math.max(...rects.map((r) => r.bottom)),
          text: el.textContent.slice(0, 40),
        });
        if (el.scrollWidth > el.clientWidth + 2) out.clipped.push(id);
      };
      for (const id of ids) add(id, $(id));
      const mark = $('brand');
      if (!mark.classList.contains('hidden')) add('brand', mark.querySelector('.mark'));
      return out;
    },
  };
})();
</script>
</body>
</html>
