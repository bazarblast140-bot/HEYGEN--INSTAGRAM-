<!doctype html>
<meta charset="utf-8" />
<title>card scene</title>
<style>
  @font-face { font-family: "Brand Sans";  src: url("../../../assets/fonts/inter-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Brand Sans";  src: url("../../../assets/fonts/inter-600.woff2") format("woff2"); font-weight: 600; font-display: block; }
  @font-face { font-family: "Brand Mono";  src: url("../../../assets/fonts/jetbrains-mono-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Brand Mono";  src: url("../../../assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Brand Serif"; src: url("../../../assets/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; font-display: block; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 720px; height: var(--stage-h, 1280px);
    background: #020617; color: #F8FAFC;
    font-family: "Brand Sans", sans-serif; overflow: hidden;
  }

  #stage { position: relative; width: 720px; height: var(--stage-h, 1280px); }
  #bg { position: absolute; inset: 0; }
  #content {
    position: absolute; left: 56px; right: 56px;
    top: var(--content-top); bottom: var(--content-bottom, auto);
    display: flex; flex-direction: column; justify-content: var(--content-justify, flex-start);
  }

  #chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: var(--chip-gap); }
  .chip {
    font-family: "Brand Mono", monospace; font-weight: 700;
    font-size: 19px; letter-spacing: .1em; text-transform: uppercase;
    padding: 9px 14px; border-radius: 5px;
    background: #1A1E2F; color: #94A3B8; border: 1px solid #334155; white-space: nowrap;
  }

  #headline {
    font-weight: 700; font-size: var(--headline-size); line-height: 1.14;
    letter-spacing: -.02em; text-wrap: balance;
  }
  #headline .w { display: inline-block; }

  #power {
    font-family: "Brand Serif", Georgia, serif; font-style: italic;
    font-size: var(--power-size); line-height: 1; letter-spacing: -.02em;
    color: #F59E0B; margin-top: var(--power-gap);
  }

  #statBlock { margin-top: var(--stat-gap); }
  #statValue {
    font-family: "Brand Mono", monospace; font-weight: 700;
    font-size: var(--stat-size); line-height: .95; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transform-origin: left center;
  }
  #statLabel {
    font-family: "Brand Mono", monospace; font-weight: 500;
    font-size: 21px; letter-spacing: .14em; text-transform: uppercase;
    color: #94A3B8; margin-top: 12px;
  }

  #footnote {
    position: absolute; left: 56px; right: 56px; top: var(--footnote-top);
    font-family: "Brand Mono", monospace; font-weight: 500;
    font-size: 19px; letter-spacing: .1em; text-transform: uppercase; color: #475569;
  }
</style>

<div id="stage">
  <canvas id="bg" width="720" height="1280"></canvas>
  <div id="content">
    <div id="chips"></div>
    <div id="headline"></div>
    <div id="power"></div>
    <div id="statBlock">
      <div id="statValue"></div>
      <div id="statLabel"></div>
    </div>
  </div>
  <div id="footnote"></div>
</div>

<script>
(() => {
  const FPS = 30;
  let TOTAL = 150;

  const LAYOUTS = {
    full:  { stageH: 1280, contentTop: 190, contentBottom: 260, justify: 'center',
             chipGap: 40, headlineSize: 60, powerSize: 92,
             powerGap: 14, statGap: 56, statSize: 118, footnoteTop: 1150 },
    panel: { stageH: 760,  contentTop: 108, contentBottom: 'auto', justify: 'flex-start',
             chipGap: 30, headlineSize: 48, powerSize: 74,
             powerGap: 10, statGap: 40, statSize: 100, footnoteTop: 664 },
  };

  const BEAT = { bg: [0, 10], chips: [0, 8], headline: [3, 20], power: [16, 30], stat: [26, 40] };

  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const p = (f, [a, b]) => clamp01((f - a) / (b - a));
  const outCubic = (t) => 1 - Math.pow(1 - t, 3);
  const outQuint = (t) => 1 - Math.pow(1 - t, 5);
  const outBack  = (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);

  let L = LAYOUTS.full;
  let data = null;
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');

  function applyLayout(name) {
    L = LAYOUTS[name] || LAYOUTS.full;
    const s = document.documentElement.style;
    s.setProperty('--stage-h', L.stageH + 'px');
    s.setProperty('--content-top', L.contentTop + 'px');
    s.setProperty('--content-bottom', L.contentBottom === 'auto' ? 'auto' : L.contentBottom + 'px');
    s.setProperty('--content-justify', L.justify);
    s.setProperty('--chip-gap', L.chipGap + 'px');
    s.setProperty('--headline-size', L.headlineSize + 'px');
    s.setProperty('--power-size', L.powerSize + 'px');
    s.setProperty('--power-gap', L.powerGap + 'px');
    s.setProperty('--stat-gap', L.statGap + 'px');
    s.setProperty('--stat-size', L.statSize + 'px');
    s.setProperty('--footnote-top', L.footnoteTop + 'px');

    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(720 * dpr);
    canvas.height = Math.round(L.stageH * dpr);
    canvas.style.width = '720px';
    canvas.style.height = L.stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /**
   * Slow drifting dot field — the ambient texture the reference reels put behind
   * their data beats. Positions come from the frame index alone, never a clock,
   * so the background is as reproducible as everything else.
   */
  function paintBackground(f) {
    const H = L.stageH;
    ctx.clearRect(0, 0, 720, H);

    const glow = ctx.createRadialGradient(560, H * 0.16, 0, 560, H * 0.16, H * 0.62);
    glow.addColorStop(0, 'rgba(37,52,84,.55)');
    glow.addColorStop(1, 'rgba(2,6,23,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, 720, H);

    const step = 44;
    const drift = (f * 0.22) % step;
    const fade = outCubic(p(f, BEAT.bg));

    for (let y = -step; y < H + step; y += step) {
      for (let x = -step; x < 720 + step; x += step) {
        const px = x + drift;
        const py = y + drift * 0.5;
        // Fade the field out toward the bottom so type stays the brightest thing.
        const depth = 1 - py / (H * 1.25);
        ctx.fillStyle = `rgba(51,65,85,${(0.5 * depth * fade).toFixed(3)})`;
        ctx.fillRect(px, py, 2, 2);
      }
    }
  }

  function paintDom(f) {
    // Continuous drift across the beat, so a card that has finished revealing is
    // still moving. Held frames were the main reason the cut read as a slideshow.
    const progress = TOTAL > 1 ? f / (TOTAL - 1) : 0;
    const content = document.getElementById('content');
    content.style.transform = `scale(${(1 + progress * 0.035).toFixed(4)}) translateY(${(-progress * 10).toFixed(2)}px)`;
    content.style.transformOrigin = 'center center';

    document.querySelectorAll('#chips .chip').forEach((chip, i) => {
      const t = outCubic(p(f - i * 1.5, BEAT.chips));
      chip.style.opacity = t;
      chip.style.transform = `translateY(${(1 - t) * 14}px)`;
    });

    // Headline reveals word by word, the way the reference captions do.
    const words = document.querySelectorAll('#headline .w');
    words.forEach((w, i) => {
      const t = outQuint(p(f - i * 1.1, BEAT.headline));
      w.style.opacity = t;
      w.style.transform = `translateY(${(1 - t) * 18}px)`;
    });

    const tp = p(f, BEAT.power);
    const power = document.getElementById('power');
    power.style.opacity = clamp01(tp * 3);
    power.style.transform = `translateY(${(1 - outQuint(tp)) * 20}px)`;

    const stat = document.getElementById('statBlock');
    if (!data.stat) { stat.style.display = 'none'; return; }
    const ts = p(f, BEAT.stat);
    stat.style.opacity = clamp01(ts * 3);
    stat.style.transform = `scale(${ts > 0 ? outBack(ts) : 0})`;
    stat.style.transformOrigin = 'left center';
  }

  window.__scene = {
    fps: FPS,
    get totalFrames() { return TOTAL; },

    load(payload) {
      data = payload;
      TOTAL = payload.totalFrames || 150;
      applyLayout(payload.layout || 'full');

      document.getElementById('chips').innerHTML = (payload.chips || [])
        .map((c) => `<span class="chip"></span>`).join('');
      document.querySelectorAll('#chips .chip').forEach((el, i) => { el.textContent = payload.chips[i]; });

      document.getElementById('headline').innerHTML = String(payload.headline || '')
        .split(/\s+/).filter(Boolean).map(() => `<span class="w"></span>`).join(' ');
      const words = String(payload.headline || '').split(/\s+/).filter(Boolean);
      document.querySelectorAll('#headline .w').forEach((el, i) => { el.textContent = words[i]; });

      document.getElementById('power').textContent = payload.power || '';
      document.getElementById('footnote').textContent = payload.footnote || '';

      if (payload.stat) {
        const value = document.getElementById('statValue');
        value.textContent = payload.stat.value;
        value.style.color =
          payload.stat.direction === 'down' ? '#EF4444' : payload.stat.direction === 'up' ? '#22C55E' : '#F8FAFC';
        document.getElementById('statLabel').textContent = payload.stat.label || '';

        // Long figures like "+2,847 Cr" overflow the column at the base size and
        // used to wrap. Measure once and shrink to fit rather than truncating.
        value.style.fontSize = L.statSize + 'px';
        const available = 720 - 56 * 2;
        const natural = value.scrollWidth;
        if (natural > available) {
          value.style.fontSize = Math.floor(L.statSize * (available / natural)) + 'px';
        }
      }
      this.seek(0);
    },

    seek(f) {
      if (!data) throw new Error('__scene.load() must be called before seek()');
      paintBackground(f);
      paintDom(f);
      document.documentElement.dataset.frame = String(f);
    },
  };
})();
</script>
