name = "factvizer-scheduler"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# UTC, like GitHub's. Keep these identical to SLOTS in src/worker.js -- the
# Worker throws on a cron it cannot map rather than firing nothing.
[triggers]
# Finance stays on. ai (09:30 IST) and news (16:30 IST) are listed so the
# schedule exists, and the worker no-ops them unless ENABLE_AI_NEWS_CAROUSELS
# is set to "true" here and the worker is redeployed. Leave it unset.
crons = ["0 7 * * *", "0 14 * * *", "0 4 * * *", "0 11 * * *"]

[vars]
REPO = "bazarblast140-bot/HEYGEN--INSTAGRAM-"

# GITHUB_TOKEN is a secret, not a var:
#   npx wrangler secret put GITHUB_TOKEN
