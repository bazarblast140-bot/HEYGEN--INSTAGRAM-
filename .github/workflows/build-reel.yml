name: Build reel

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Reel spec to build
        default: pipeline/specs/default.json
      fixture:
        description: Use sample market data instead of live
        type: boolean
        default: false
      publish:
        description: Publish to Instagram after building
        type: boolean
        default: false
      generate:
        description: Write today's script with Claude (off = use the checked-in spec)
        type: boolean
        default: true
      preview:
        description: Build the mp4, cover, and caption for review. Never publishes, and does not use the posting queue.
        type: boolean
        default: false
      force:
        description: Build and publish even if a Reel already went out today
        type: boolean
        default: false
  # EVENING FALLBACK — owner decision 2026-10-03.
  # Paise Ki Pathshala posts up to three Reels a day to this account (08:30,
  # 16:00, 21:00 IST). The own Reel goes out only on a day with no Reel at all:
  # the "Already published today?" step checks Instagram for ANY Reel dated today
  # (IST) before every paid step and soft-skips when one exists. The 07:00 IST
  # slot and its morning catch-ups are gone. Times are UTC, minutes off :00/:30,
  # outside the busy 22:30–01:30 UTC band:
  #   21:47 IST  17 16   fallback publish time
  #   22:13 IST  43 16   catch-up
  #   22:41 IST  11 17   catch-up
  schedule:
    - cron: '17 16 * * *'
    - cron: '43 16 * * *'
    - cron: '11 17 * * *'

permissions:
  contents: write

concurrency:
  # Preview must not sit in the same queue as a scheduled publish.
  group: ${{ github.event.inputs.preview == 'true' && 'build-reel-preview' || 'build-reel' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Publish ledger or Instagram media — not the topic file. Run 36965276637
      # recorded a topic and then failed hosting, so a topic check would skip
      # the retry. Any Reel on Instagram today (Paise or own) is a soft skip, and
      # so is an unreadable media list (fail closed). This step is before npm ci,
      # Chromium, DeepSeek, and ElevenLabs.
      - name: Already published today?
        id: day
        env:
          FORCE: ${{ github.event.inputs.force }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: node pipeline/reel-status.js | tee -a "$GITHUB_STEP_SUMMARY"

      # The reel speaks only in the ElevenLabs library voice "Rudra". Checked here,
      # after the same-day guard (so a skip day costs nothing) and before npm ci,
      # DeepSeek and ElevenLabs synthesis. One read-only GET; spends no credit.
      - name: Check the reel voice (Rudra)
        if: ${{ steps.day.outputs.pending == 'true' || github.event.inputs.preview == 'true' || github.event.inputs.force == 'true' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          REEL_VOICE_ID: ${{ vars.REEL_VOICE_ID || 'ypnkIsDASPgHZuanrF0q' }}
          REEL_VOICE_NAME: ${{ vars.REEL_VOICE_NAME || 'Rudra' }}
        run: |
          set -u
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::ELEVENLABS_API_KEY is not set — the reel cannot be voiced."
            exit 1
          fi
          VOICE="$(echo "${ELEVENLABS_VOICE_ID:-}" | tr -d '[:space:]')"
          if [ -n "$VOICE" ] && [ "$VOICE" != "$REEL_VOICE_ID" ]; then
            echo "::error::Repository variable ELEVENLABS_VOICE_ID is '$VOICE', not the reel voice $REEL_VOICE_ID ($REEL_VOICE_NAME). Fix the variable; nothing was synthesised."
            exit 1
          fi
          CODE=$(curl -sS -o voice.json -w '%{http_code}' --max-time 20 \
            -H "xi-api-key: $ELEVENLABS_API_KEY" \
            "https://api.elevenlabs.io/v1/voices/$REEL_VOICE_ID") || CODE=000
          if [ "$CODE" != "200" ]; then
            DETAIL=$(head -c 300 voice.json 2>/dev/null | tr -d '\n' || true)
            echo "::error::Reel voice $REEL_VOICE_ID ($REEL_VOICE_NAME) is not accessible on this ElevenLabs account (HTTP $CODE): $DETAIL — add it to My Voices (run the 'Reel voice check' workflow) or give the key voices_read."
            exit 1
          fi
          NAME=$(jq -r '.name // ""' voice.json)
          CATEGORY=$(jq -r '.category // ""' voice.json)
          if ! printf '%s' "$NAME" | grep -qi -- "$REEL_VOICE_NAME"; then
            echo "::error::ElevenLabs voice $REEL_VOICE_ID is named '$NAME', which does not contain '$REEL_VOICE_NAME'. Refusing to build with an unexpected voice."
            exit 1
          fi
          echo "Reel voice OK: $NAME ($CATEGORY) $REEL_VOICE_ID" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install ffmpeg
        if: ${{ steps.day.outputs.pending == 'true' || github.event.inputs.preview == 'true' || github.event.inputs.force == 'true' }}
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        if: ${{ steps.day.outputs.pending == 'true' || github.event.inputs.preview == 'true' || github.event.inputs.force == 'true' }}
        run: npm ci

      - name: Run the unit tests
        if: ${{ steps.day.outputs.pending == 'true' || github.event.inputs.preview == 'true' || github.event.inputs.force == 'true' }}
        run: npm test

      - name: Install Chromium for Playwright
        if: ${{ steps.day.outputs.pending == 'true' || github.event.inputs.preview == 'true' || github.event.inputs.force == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Check the Instagram token
        if: ${{ steps.day.outputs.pending == 'true' && github.event.inputs.preview != 'true' && (github.event_name == 'schedule' || github.event.inputs.publish == 'true') }}
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: node pipeline/publish-reel.js --whoami

      - name: Build the reel
        if: ${{ steps.day.outputs.pending == 'true' || github.event.inputs.preview == 'true' || github.event.inputs.force == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          SCRIPT_API_KEY: ${{ secrets.SCRIPT_API_KEY }}
          SCRIPT_BASE_URL: ${{ vars.SCRIPT_BASE_URL }}
          SCRIPT_PROVIDER: ${{ vars.SCRIPT_PROVIDER }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Defaults live in src/config.js ELEVEN: voice Rudra ypnkIsDASPgHZuanrF0q,
          # model eleven_multilingual_v2, stability 0.5, style 0.25, speed 0.9.
          # Repository variables override them. Synthesis refuses any voice that
          # is not REEL_VOICE_ID (Rudra unless that variable is set).
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY }}
          ELEVENLABS_STYLE: ${{ vars.ELEVENLABS_STYLE }}
          ELEVENLABS_SPEED: ${{ vars.ELEVENLABS_SPEED }}
          REEL_VOICE_ID: ${{ vars.REEL_VOICE_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          PREVIEW="${{ github.event.inputs.preview }}"
          GEN=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.generate }}" != "false" ] || [ "$PREVIEW" = "true" ]; then
            GEN="--generate"
          fi
          REQUIRE=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$PREVIEW" = "true" ] || [ "${{ github.event.inputs.publish }}" = "true" ]; then
            REQUIRE="--require-generated"
          fi
          PREVIEW_ARG=""
          if [ "$PREVIEW" = "true" ]; then PREVIEW_ARG="--preview"; fi
          node pipeline/build-reel.js \
            --spec "${{ github.event.inputs.spec || 'pipeline/specs/default.json' }}" \
            ${{ github.event.inputs.fixture == 'true' && '--fixture' || '' }} \
            $GEN $REQUIRE $PREVIEW_ARG

      - name: Summarise the run
        if: always()
        run: |
          report=pipeline/out/run-report.json
          [ -f "$report" ] || { echo "No run report — the build failed before assembly." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## Reel"
            echo '```json'
            cat "$report"
            echo '```'
            if [ "$(jq -r .publishable "$report")" = "true" ]; then
              echo "**Publishable.**"
            else
              echo "**Not publishable** — see \`notes\` above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Host the video where Instagram can fetch it
        id: host
        if: ${{ steps.day.outputs.pending == 'true' && github.event.inputs.preview != 'true' && (github.event_name == 'schedule' || github.event.inputs.publish == 'true' || github.event.inputs.force == 'true') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          COVER=""
          if [ -f pipeline/out/reel-cover.jpg ]; then COVER="--cover pipeline/out/reel-cover.jpg"; fi
          node pipeline/host-video.js --file pipeline/out/reel-final.mp4 $COVER

      - name: Publish to Instagram
        id: publish
        if: ${{ steps.day.outputs.pending == 'true' && github.event.inputs.preview != 'true' && (github.event_name == 'schedule' || github.event.inputs.publish == 'true' || github.event.inputs.force == 'true') }}
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
          # Unset means off. A Reel Story is not published until this variable is true.
          ENABLE_REEL_STORY: ${{ vars.ENABLE_REEL_STORY }}
        run: |
          if [ "${{ github.event.inputs.preview }}" = "true" ]; then
            echo "Preview never publishes."
            exit 1
          fi
          set -o pipefail
          COVER=""
          if [ -n "${{ steps.host.outputs.cover_url }}" ]; then COVER="--cover ${{ steps.host.outputs.cover_url }}"; fi
          node pipeline/publish-reel.js \
            --url "${{ steps.host.outputs.url }}" \
            --report pipeline/out/run-report.json \
            --caption-file pipeline/out/caption.txt \
            $COVER \
            2>&1 | tee publish.log
          # Topic and media id are recorded only after this publish succeeds.
          # A hosting failure never reaches this line, so it cannot block the retry.
          node pipeline/record-reel-publish.js --log publish.log
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/topic-history.json pipeline/reel-publish-history.json
          git diff --cached --quiet && { echo "No published reel to record."; exit 0; }
          git commit -m "Record $(date -u +%Y-%m-%d) published reel"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          echo "Could not record the published reel — the next run may repeat it." >> "$GITHUB_STEP_SUMMARY"

      # Facebook is a copy of a post that is already live. It never runs unless
      # the Instagram publish succeeded, and it can never fail this job.
      - name: Copy to the Facebook Page
        if: ${{ always() && steps.publish.outcome == 'success' && vars.FB_CROSSPOST == 'true' }}
        continue-on-error: true
        env:
          FB_CROSSPOST: ${{ vars.FB_CROSSPOST }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          ID=$(sed -e 's/\x1b\[[0-9;]*m//g' publish.log | grep -oE '^[[:space:]]*published:? [0-9]+' | head -n 1 | grep -oE '[0-9]+$' || true)
          node pipeline/fb-crosspost.js --kind reel --ig-media "$ID" \
            --video-url "${{ steps.host.outputs.url }}" --caption-file pipeline/out/caption.txt 2>&1 | tee fb.log
          sed -e 's/\x1b\[[0-9;]*m//g' fb.log >> "$GITHUB_STEP_SUMMARY"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/fb-crosspost-history.json
          git diff --cached --quiet && exit 0
          git commit -m "Record $(date -u +'%Y-%m-%d %H:%M') Facebook cross-post"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          echo "Could not record the Facebook cross-post." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel
          path: |
            pipeline/out/reel-final.mp4
            pipeline/out/reel-cover.jpg
            pipeline/out/reel-story-preview.jpg
            pipeline/out/caption.txt
            pipeline/out/run-report.json
            pipeline/out/build/word-timestamps.json
          retention-days: 14
          if-no-files-found: warn
