name: Build reel

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Reel spec to build
        default: pipeline/specs/default.json
      fixture:
        description: Use sample market data instead of live
        type: boolean
        default: false
      no_avatar:
        description: Skip HeyGen avatar (saves credits)
        type: boolean
        default: false
      publish:
        description: Publish to Instagram after building
        type: boolean
        default: false
      generate:
        description: Write today's script with Claude (off = use the checked-in spec)
        type: boolean
        default: true
  # The 7am weekday schedule is switched off. It used to be:
  #
  #   schedule:
  #     - cron: '30 1 * * 1-5'    # 07:00 IST; Actions cron is UTC, IST is UTC+5:30
  #
  # A scheduled run publishes to Instagram and spends ElevenLabs and market-data
  # quota every weekday whether or not anyone is watching it, so it does not stay
  # armed on a paused project. Uncomment to start the daily post again.

permissions:
  contents: write

concurrency:
  group: build-reel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm ci

      - name: Run the unit tests
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Check the Instagram token
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish == 'true' }}
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: node pipeline/publish-reel.js --whoami

      - name: Build the reel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          SCRIPT_API_KEY: ${{ secrets.SCRIPT_API_KEY }}
          SCRIPT_BASE_URL: ${{ vars.SCRIPT_BASE_URL }}
          SCRIPT_PROVIDER: ${{ vars.SCRIPT_PROVIDER }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID: ${{ vars.HEYGEN_AVATAR_ID }}
          HEYGEN_AVATAR_KIND: ${{ vars.HEYGEN_AVATAR_KIND }}
          HEYGEN_ENGINE: ${{ vars.HEYGEN_ENGINE }}
          HEYGEN_VOICE_ID: ${{ vars.HEYGEN_VOICE_ID }}
          HEYGEN_SPEECH_PATH: ${{ vars.HEYGEN_SPEECH_PATH }}
          HEYGEN_TTS_LANGUAGE: ${{ vars.HEYGEN_TTS_LANGUAGE }}
          VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          node pipeline/build-reel.js \
            --spec "${{ github.event.inputs.spec || 'pipeline/specs/default.json' }}" \
            ${{ github.event.inputs.fixture == 'true' && '--fixture' || '' }} \
            ${{ github.event.inputs.no_avatar == 'true' && '--no-avatar' || '' }} \
            ${{ github.event_name == 'schedule' || github.event.inputs.generate != 'false' && '--generate' || '' }}

      - name: Summarise the run
        if: always()
        run: |
          report=pipeline/out/run-report.json
          [ -f "$report" ] || { echo "No run report — the build failed before assembly." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## Reel"
            echo '```json'
            cat "$report"
            echo '```'
            if [ "$(jq -r .publishable "$report")" = "true" ]; then
              echo "**Publishable.**"
            else
              echo "**Not publishable** — see \`notes\` above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remember today's topic
        # The ledger is what stops the reel telling the same story twice. It only
        # works if it outlives the runner, so it is committed back to the branch.
        if: ${{ github.event_name == 'schedule' || github.event.inputs.generate != 'false' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/topic-history.json
          git diff --cached --quiet && { echo "No new topic to record."; exit 0; }
          git commit -m "Record $(date -u +%Y-%m-%d) topic"
          # A concurrent run may have recorded its own topic first; take theirs
          # and replay ours on top rather than clobbering the ledger.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          echo "Could not record the topic — the next run may repeat it." >> "$GITHUB_STEP_SUMMARY"

      - name: Host the video where Instagram can fetch it
        id: host
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: node pipeline/host-video.js --file pipeline/out/reel-final.mp4

      - name: Publish to Instagram
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish == 'true' }}
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: |
          node pipeline/publish-reel.js \
            --url "${{ steps.host.outputs.url }}" \
            --report pipeline/out/run-report.json \
            --caption-file pipeline/out/caption.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel
          path: |
            pipeline/out/reel-final.mp4
            pipeline/out/run-report.json
            pipeline/out/build/word-timestamps.json
          retention-days: 14
          if-no-files-found: warn
