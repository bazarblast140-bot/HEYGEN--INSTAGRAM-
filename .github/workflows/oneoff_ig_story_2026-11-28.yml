name: One-off finance news IG Reel+Story 2026-11-28
on:
  workflow_dispatch:
    inputs:
      release_authorized:
        description: "Only after direct owner approval, exact-video QA, last-post/duplicate checks for Instagram; no automatic resume; IG only (no Facebook in this run)"
        type: boolean
        required: true
        default: false
jobs:
  publish:
    if: ${{ inputs.release_authorized }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch media + caption
        run: |
          mkdir -p run
          curl -fsSL -L -o run/final.mp4 "https://github.com/bazarblast140-bot/HEYGEN--INSTAGRAM-/releases/download/ig-reel-2026-11-28-finance/paise-finance-2026-11-28.mp4"
          curl -fsSL -L -o run/thumbnail.jpg "https://github.com/bazarblast140-bot/HEYGEN--INSTAGRAM-/releases/download/ig-reel-2026-11-28-finance/paise-finance-2026-11-28-cover.jpg"
          curl -fsSL -L -o run/caption.txt "https://github.com/bazarblast140-bot/HEYGEN--INSTAGRAM-/releases/download/ig-reel-2026-11-28-finance/finance_caption.txt"
          python - <<'PY'
          from pathlib import Path
          cap=Path("run/caption.txt").read_text(encoding="utf-8")
          title=cap.splitlines()[0][:100]
          import json, hashlib
          sha=hashlib.sha256(Path("run/final.mp4").read_bytes()).hexdigest()
          print("caption", len(cap), "title", title, "sha256", sha, "bytes", Path("run/final.mp4").stat().st_size)
          assert sha.startswith("4acd7eae"), sha
          PY
      - name: Instagram Reel + Story via Graph
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, time, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          IG=os.environ["IG_USER_ID"]; T=os.environ["IG_ACCESS_TOKEN"]
          V="https://github.com/bazarblast140-bot/HEYGEN--INSTAGRAM-/releases/download/ig-reel-2026-11-28-finance/paise-finance-2026-11-28.mp4"
          C="https://github.com/bazarblast140-bot/HEYGEN--INSTAGRAM-/releases/download/ig-reel-2026-11-28-finance/paise-finance-2026-11-28-cover.jpg"
          cap=Path("run/caption.txt").read_text(encoding="utf-8")
          def post(path, data):
            body=urllib.parse.urlencode(data).encode()
            req=urllib.request.Request(f"https://graph.facebook.com/v23.0/{path}", data=body, method="POST")
            try:
              return json.loads(urllib.request.urlopen(req, timeout=180).read())
            except urllib.error.HTTPError as e:
              raise SystemExit(f"HTTP {e.code}: {e.read().decode()[:800]}")
          def get(path):
            return json.loads(urllib.request.urlopen(f"https://graph.facebook.com/v23.0/{path}", timeout=60).read())
          # Re-check last post / duplicate immediately before publish
          recent=get(f"{IG}/media?fields=id,caption,timestamp,permalink,media_product_type&limit=5&access_token={T}")
          print("IG_PRECHECK", json.dumps([{k: (v[:80] if k=='caption' and isinstance(v,str) else v) for k,v in it.items()} for it in (recent.get('data') or [])], ensure_ascii=False))
          for it in recent.get("data") or []:
            cap0=it.get("caption") or ""
            ts=it.get("timestamp") or ""
            if "989 अंक टूटा" in cap0 or "चाँदी 9% उछली" in cap0:
              raise SystemExit(f"DUPLICATE already up: {it.get('id')} {it.get('permalink')}")
            if ts.startswith("2026-11-28"):
              raise SystemExit(f"Already posted today, skip: {it.get('id')} {it.get('permalink')} {ts}")
            # 3-hour spacing
            try:
              from datetime import datetime, timezone, timedelta
              IST=timezone(timedelta(hours=5,minutes=30))
              dt=datetime.fromisoformat(ts.replace("Z","+00:00")).astimezone(IST)
              gap=(datetime.now(IST)-dt).total_seconds()/3600
              if gap < 3:
                raise SystemExit(f"SPACING: last post {dt} is only {gap:.2f}h ago, need ~3h")
            except SystemExit:
              raise
            except Exception as e:
              print("ts_parse_warn", ts, e)
          params={"media_type":"REELS","video_url":V,"caption":cap,"access_token":T,"cover_url":C}
          cont=post(f"{IG}/media", params); print("container", cont); cid=cont["id"]
          st={}
          for i in range(48):
            st=get(f"{cid}?fields=status_code,status&access_token={T}"); print("status", st)
            if st.get("status_code")=="FINISHED": break
            if st.get("status_code")=="ERROR": raise SystemExit(st)
            time.sleep(5)
          else:
            raise SystemExit("timeout waiting FINISHED")
          pub=post(f"{IG}/media_publish", {"creation_id":cid,"access_token":T}); print("published", pub)
          mid=pub["id"]
          info=get(f"{mid}?fields=id,permalink,caption,timestamp,media_type,media_product_type,thumbnail_url&access_token={T}")
          print("IG_READBACK", json.dumps(info, ensure_ascii=False))
          Path("run/ig_readback.json").write_text(json.dumps(info,ensure_ascii=False,indent=2),encoding="utf-8")
          # Story (same post)
          try:
            scont=post(f"{IG}/media", {"media_type":"STORIES","video_url":V,"access_token":T}); print("story container", scont); scid=scont["id"]
            for i in range(48):
              st=get(f"{scid}?fields=status_code,status&access_token={T}"); print("story status", st)
              if st.get("status_code")=="FINISHED": break
              if st.get("status_code")=="ERROR":
                print("STORY_FAIL", st); Path("run/ig_story.json").write_text(json.dumps({"error":st},ensure_ascii=False,indent=2),encoding="utf-8"); scid=None; break
              time.sleep(5)
            if scid and st.get("status_code")=="FINISHED":
              spub=post(f"{IG}/media_publish", {"creation_id":scid,"access_token":T}); print("story published", spub)
              Path("run/ig_story.json").write_text(json.dumps(spub,ensure_ascii=False,indent=2),encoding="utf-8")
          except SystemExit as e:
            print("STORY_BLOCKED", e)
            Path("run/ig_story.json").write_text(json.dumps({"error":str(e)},ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Upload readbacks
        if: ${{ always() && inputs.release_authorized }}
        uses: actions/upload-artifact@v4
        with:
          name: finance-ig-story-readback-2026-11-28
          path: run/*.json
          if-no-files-found: warn
