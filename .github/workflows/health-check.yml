name: Health check

# 08:00, 14:00 and 20:00 IST. Does not publish and does not change the
# carousel or reel schedules. A failing check opens or updates one issue
# labelled health-alert. A green check closes that issue.

on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '30 8 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tokens, balances, and scheduler crons
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_APP_ID: ${{ vars.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MIN_BALANCE: ${{ vars.DEEPSEEK_MIN_BALANCE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MIN_CHARS: ${{ vars.ELEVENLABS_MIN_CHARS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          node pipeline/health-check.js | tee health.log
      - name: Write the summary
        if: always()
        run: |
          {
            echo '## Health'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' health.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
