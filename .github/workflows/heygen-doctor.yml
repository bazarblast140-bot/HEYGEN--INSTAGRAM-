name: HeyGen doctor

# Answers "why did the reel come out wrong?" in one run, from inside CI where the
# HeyGen API is actually reachable. Spends no avatar credits. Prints no secrets.

on:
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the HeyGen account, presenter and voice
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID: ${{ vars.HEYGEN_AVATAR_ID }}
          HEYGEN_AVATAR_KIND: ${{ vars.HEYGEN_AVATAR_KIND }}
          HEYGEN_VOICE_ID: ${{ vars.HEYGEN_VOICE_ID }}
          HEYGEN_SPEECH_PATH: ${{ vars.HEYGEN_SPEECH_PATH }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
        run: |
          node pipeline/heygen-doctor.js 2>&1 | tee doctor.log
          {
            echo '## HeyGen doctor'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' doctor.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
