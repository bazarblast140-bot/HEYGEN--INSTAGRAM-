name: Build carousel

# 4 finance carousels a day — morning / midday / afternoon / evening — each a
# different topic. Catch-up crons exist because GitHub schedule is best-effort;
# the ledger (YYYY-MM-DD <slot>) prevents duplicates.
#
# A scheduled run PUBLISHES. Guards reject unsourced slides, repeated topics,
# and non-JPEG builds.

on:
  repository_dispatch:
    types: [carousel]

  schedule:
    # morning   ~08:07 IST + catch-up ~08:52
    - cron: '37 2 * * *'
    - cron: '22 3 * * *'
    # midday    ~12:07 IST + catch-up ~12:52
    - cron: '37 6 * * *'
    - cron: '22 7 * * *'
    # afternoon ~15:07 IST + catch-up ~15:52
    - cron: '37 9 * * *'
    - cron: '22 10 * * *'
    # evening   ~17:07 IST + catch-up ~17:52
    - cron: '37 11 * * *'
    - cron: '22 12 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: Publish even if this slot already posted today
        type: boolean
        default: false
      spec:
        description: Carousel spec to build
        default: pipeline/specs/carousel-hindi.json
      no_photos:
        description: Skip Pexels, use the generated gradient
        type: boolean
        default: false
      generate:
        description: Write today's topic with the model (off = the checked-in spec)
        type: boolean
        default: true
      slot:
        description: Which of the 4 daily slots
        type: choice
        options: ['morning', 'midday', 'afternoon', 'evening']
        default: 'evening'
      publish:
        description: "POST IT TO INSTAGRAM — this is public and cannot be undone"
        type: boolean
        default: false

concurrency:
  group: carousel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AUTOMATED: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Is this slot still pending?
        id: slot
        env:
          SCHEDULED_CRON: ${{ github.event.schedule }}
          DISPATCH_SLOT: ${{ github.event.client_payload.slot || github.event.inputs.slot }}
        run: node pipeline/slot-status.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the script-writing keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          node pipeline/script-doctor.js 2>&1 | tee script.log
          {
            echo '## Script providers'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' script.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the Instagram token
        continue-on-error: true
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: |
          node pipeline/instagram-doctor.js 2>&1 | tee ig.log || true
          {
            echo '## Instagram'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' ig.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium for Playwright
        if: ${{ env.AUTOMATED != 'true' || steps.slot.outputs.pending == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Build the carousel
        id: build
        if: ${{ env.AUTOMATED != 'true' || steps.slot.outputs.pending == 'true' }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
        run: |
          node pipeline/build-carousel.js \
            --spec "${{ github.event.inputs.spec || 'pipeline/specs/carousel-hindi.json' }}" \
            ${{ github.event.inputs.no_photos == 'true' && '--no-photos' || '' }} \
            ${{ github.event.inputs.generate != 'false' && '--generate' || '' }} \
            ${{ github.event.inputs.slot && format('--slot {0}', github.event.inputs.slot) || (steps.slot.outputs.slot && format('--slot {0}', steps.slot.outputs.slot)) || '' }} \
            ${{ (env.AUTOMATED == 'true' || github.event.inputs.publish == 'true') && '--require-generated' || '' }} \
            2>&1 | tee carousel.log
          {
            echo '## Carousel'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' carousel.log
            echo '```'
            echo '```json'
            cat pipeline/out/carousel-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What would be posted
        if: env.AUTOMATED != 'true' && github.event.inputs.publish != 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: |
          node pipeline/publish-carousel.js --report pipeline/out/carousel-report.json 2>&1 | tee dry.log || true
          {
            echo '## Dry run'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' dry.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Any of the 4 slots may publish (not evening-only).
      - name: Publish to Instagram
        id: publish
        if: ${{ (steps.slot.outputs.pending == 'true' && (env.AUTOMATED == 'true' || github.event.inputs.publish == 'true')) || github.event.inputs.force == 'true' }}
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node pipeline/publish-carousel.js --report pipeline/out/carousel-report.json --yes 2>&1 | tee publish.log
          {
            echo '## Published'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remember this post's topic
        if: steps.publish.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/carousel-history.json
          git diff --cached --quiet && { echo "No new topic to record."; exit 0; }
          git commit -m "Record $(date -u +'%Y-%m-%d %H:%M') carousel topic"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          echo "Could not record the topic -- the next run may repeat it." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel
          path: |
            pipeline/out/slides
            pipeline/out/story
            pipeline/out/spec-generated.json
            pipeline/out/caption.txt
            pipeline/out/carousel-report.json
          retention-days: 14
          if-no-files-found: warn

      - name: How the account is doing
        if: always()
        continue-on-error: true
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: |
          node pipeline/audit.js 2>&1 | tee audit.log || true
          {
            echo '## Audit'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Why the build failed
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          echo '--- build failed, last lines ---'
          sed -e 's/\x1b\[[0-9;]*m//g' carousel.log | tail -n 25

      - name: Why the publish failed
        if: ${{ failure() && steps.publish.outcome == 'failure' }}
        run: |
          echo '--- publish failed, last lines ---'
          sed -e 's/\x1b\[[0-9;]*m//g' publish.log | tail -n 20

      - name: Did the story go up?
        if: ${{ always() && steps.publish.outcome != 'skipped' }}
        run: |
          echo '--- story ---'
          sed -e 's/\x1b\[[0-9;]*m//g' publish.log \
            | sed -n '/^Story$/,$p' \
            | head -n 15
          echo '--- end story ---'
