name: Build carousel

# Separate from build-reel.yml on purpose. The reel job is working and this is a
# new feature; sharing a workflow would mean a change here can break the post
# that already goes out.
#
# Three posts a day IST. Actions cron is UTC, IST is UTC+5:30.
#
# Morning and evening are fact carousels, picked from the category rotation.
# Midday is technology and AI, and it is built differently on purpose: the
# stories are FETCHED, because a language model asked for today's news writes
# something fluent and either months old or invented. See src/carousel/news.js.
#
# A scheduled run PUBLISHES. That is the point of it, and it is also the reason
# every guard in this pipeline exists: an unsourced slide is rejected, a repeated
# topic is rejected, a non-JPEG build is refused. Nobody is watching at 06:00.
#
# Each slot is scheduled TWICE, and not out of caution -- the first 06:00 post
# never happened. GitHub queued no run at all: no failure, no entry in the list,
# nothing to retry. Its scheduler is best-effort and drops work under load,
# worst at round minutes like :00 and :30, which is why these sit at :37 and :22.
#
# The second firing is a catch-up, and the ledger is what stops it posting twice:
# a slot with an entry for today is already done, so the run ends in seconds. See
# pipeline/slot-status.js.

on:
  schedule:
    - cron: '37 0 * * *'     # 06:07 IST -- a fact carousel
    - cron: '22 1 * * *'     # 06:52 IST -- catch-up if the first was dropped
    - cron: '37 7 * * *'     # 13:07 IST -- technology and AI, from today's stories
    - cron: '22 8 * * *'     # 13:52 IST -- catch-up
    - cron: '37 11 * * *'    # 17:07 IST -- a fact carousel
    - cron: '22 12 * * *'    # 17:52 IST -- catch-up
  workflow_dispatch:
    inputs:
      spec:
        description: Carousel spec to build
        default: pipeline/specs/carousel-hindi.json
      no_photos:
        description: Skip Pexels, use the generated gradient
        type: boolean
        default: false
      generate:
        description: Write today's topic with the model (off = the checked-in spec)
        type: boolean
        default: true
      publish:
        description: "POST IT TO INSTAGRAM — this is public and cannot be undone"
        type: boolean
        default: false

# One at a time. Both runs commit the topic ledger back to the branch, and two
# runs racing that push is how a day ends up with the same fact twice.
concurrency:
  group: carousel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # contents: write is for the release the slides are hosted on -- Instagram
    # fetches each image from a public URL and never accepts an upload.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A scheduled run is one of two firings for the same slot. If the earlier
      # one already posted, this ends here rather than posting the day twice.
      # A hand-started run is never skipped -- asking for a post is asking for
      # a post.
      - name: Is this slot still pending?
        id: slot
        run: node pipeline/slot-status.js | tee -a "$GITHUB_STEP_SUMMARY"

      # Answers "is the script key live?" without spending a token. It is here
      # rather than in the reel job because that job's failure mode is a whole
      # silent reel; this one just prints the vendor's own verdict.
      - name: Check the script-writing keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          node pipeline/script-doctor.js 2>&1 | tee script.log
          {
            echo '## Script providers'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' script.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Read-only. It resolves the configured IG_USER_ID against the token and
      # prints whose account it is -- publishing nothing. "The token is set" and
      # "the token still works" are different facts, and a Facebook-surface token
      # expires; finding that out at post time means a missed day.
      - name: Check the Instagram token
        continue-on-error: true
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: |
          node pipeline/instagram-doctor.js 2>&1 | tee ig.log || true
          {
            echo '## Instagram'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' ig.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium for Playwright
        if: ${{ github.event_name != 'schedule' || steps.slot.outputs.pending == 'true' }}
        run: npx playwright install --with-deps chromium

      # The bundled Devanagari face is a hard requirement, not a nicety. The
      # renderer now forces every declared @font-face to load before it measures
      # anything, so a missing or corrupt font fails this step loudly instead of
      # shipping tofu that is only visible once the image is on Instagram.
      - name: Build the carousel
        if: ${{ github.event_name != 'schedule' || steps.slot.outputs.pending == 'true' }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
        run: |
          node pipeline/build-carousel.js \
            --spec "${{ github.event.inputs.spec || 'pipeline/specs/carousel-hindi.json' }}" \
            ${{ github.event.inputs.no_photos == 'true' && '--no-photos' || '' }} \
            ${{ github.event.inputs.generate != 'false' && '--generate' || '' }} \
            ${{ (github.event_name == 'schedule' || github.event.inputs.publish == 'true') && '--require-generated' || '' }} \
            2>&1 | tee carousel.log
          {
            echo '## Carousel'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' carousel.log
            echo '```'
            echo '```json'
            cat pipeline/out/carousel-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # publish off: show what would go out -- which account, which files, the
      # caption in full -- and post nothing. Cheap, and it catches a caption that
      # got mangled or a token that resolves to the wrong account, at the point
      # where that is still free to fix.
      - name: What would be posted
        if: github.event_name != 'schedule' && github.event.inputs.publish != 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: |
          node pipeline/publish-carousel.js --report pipeline/out/carousel-report.json 2>&1 | tee dry.log || true
          {
            echo '## Dry run'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' dry.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The only step in this workflow that is visible to anyone but us, and the
      # only one that cannot be undone from here -- a wrong post is deleted by
      # hand, from the phone, after people have seen it. So it runs when it is
      # asked for and never by default.
      - name: Publish to Instagram
        id: publish
        if: ${{ (github.event_name == 'schedule' && steps.slot.outputs.pending == 'true') || github.event.inputs.publish == 'true' }}
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node pipeline/publish-carousel.js --report pipeline/out/carousel-report.json --yes 2>&1 | tee publish.log
          {
            echo '## Published'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The ledger is what stops the same fact going out twice, and it only works
      # if it outlives the runner -- so it is committed back to the branch.
      #
      # After publishing, and only when publishing succeeded. A topic that was
      # written but never posted is not spent: recording it would retire a fact
      # nobody has seen, and a build that failed at the last step would quietly
      # cost the account its subject.
      - name: Remember this post's topic
        if: steps.publish.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/carousel-history.json
          git diff --cached --quiet && { echo "No new topic to record."; exit 0; }
          git commit -m "Record $(date -u +'%Y-%m-%d %H:%M') carousel topic"
          # The other slot may have recorded its own topic first; take theirs and
          # replay ours on top rather than clobbering the ledger.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          echo "Could not record the topic -- the next run may repeat it." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel
          path: |
            pipeline/out/slides
            pipeline/out/spec-generated.json
            pipeline/out/caption.txt
            pipeline/out/carousel-report.json
          retention-days: 14
          if-no-files-found: warn
