name: Build carousel

# Two finance carousels a day stay on. Publish times do not move.
#   midday   optional, 12:30 IST
#   evening  the main post, 19:30 IST, plus one Story
# Two more slots exist and no-op unless the repository variable
# ENABLE_AI_NEWS_CAROUSELS is true:
#   ai       latest AI update, 09:30 IST
#   news     latest big news, 16:30 IST
# Each slot has the publish cron plus three catch-ups (odd minutes, never
# :00/:30, outside the 22:30–01:30 UTC band). slot-status keeps the cron's
# slot even when GitHub is late, and the ledger (YYYY-MM-DD <slot>, IST)
# stops a second copy. A dispatch with no slot, or outside every window,
# is a soft skip (exit 0). It does not call the script model.
#
# A scheduled run PUBLISHES. Guards reject unsourced slides, repeated topics,
# and non-JPEG builds.

on:
  repository_dispatch:
    types: [carousel]

  schedule:
    # midday 12:30 IST, then 12:37, 12:52, 13:11
    - cron: '0 7 * * *'
    - cron: '7 7 * * *'
    - cron: '22 7 * * *'
    - cron: '41 7 * * *'
    # evening 19:30 IST, then 19:37, 19:52, 20:11
    - cron: '0 14 * * *'
    - cron: '7 14 * * *'
    - cron: '22 14 * * *'
    - cron: '41 14 * * *'
    # ai 09:30 IST, then 09:37, 09:52, 10:11 — no-op unless ENABLE_AI_NEWS_CAROUSELS=true
    - cron: '0 4 * * *'
    - cron: '7 4 * * *'
    - cron: '22 4 * * *'
    - cron: '41 4 * * *'
    # news 16:30 IST, then 16:37, 16:52, 17:11 — no-op unless ENABLE_AI_NEWS_CAROUSELS=true
    - cron: '0 11 * * *'
    - cron: '7 11 * * *'
    - cron: '22 11 * * *'
    - cron: '41 11 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: Publish even if this slot already posted today
        type: boolean
        default: false
      spec:
        description: Carousel spec to build
        default: pipeline/specs/carousel-hindi.json
      no_photos:
        description: Skip Pexels, use the generated gradient
        type: boolean
        default: false
      generate:
        description: Write today's topic with the model (off = the checked-in spec)
        type: boolean
        default: true
      slot:
        description: auto derives the slot from the IST clock, or skips outside the windows
        type: choice
        options: ['auto', 'midday', 'evening', 'ai', 'news']
        default: 'auto'
      publish:
        description: "POST IT TO INSTAGRAM — this is public and cannot be undone"
        type: boolean
        default: false
      preview:
        description: Generate this slot now for review. Does not publish and does not use the posting queue.
        type: boolean
        default: false

concurrency:
  # Preview must not sit in the same queue as a scheduled publish.
  group: ${{ github.event.inputs.preview == 'true' && 'carousel-preview' || 'carousel' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AUTOMATED: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' }}
      # Unset means off. Do not set these repository variables until a preview is approved.
      ENABLE_AI_NEWS_CAROUSELS: ${{ vars.ENABLE_AI_NEWS_CAROUSELS }}
      ENABLE_CAROUSEL_STORY: ${{ vars.ENABLE_CAROUSEL_STORY }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Is this slot still pending?
        id: slot
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
          DISPATCH_SLOT: ${{ github.event.client_payload.slot || github.event.inputs.slot }}
          FORCE: ${{ github.event.inputs.force }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: node pipeline/slot-status.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the script-writing keys
        if: ${{ steps.slot.outputs.pending == 'true' || github.event.inputs.preview == 'true' || github.event.inputs.force == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          node pipeline/script-doctor.js 2>&1 | tee script.log
          {
            echo '## Script providers'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' script.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the Instagram token
        continue-on-error: true
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: |
          node pipeline/instagram-doctor.js 2>&1 | tee ig.log || true
          {
            echo '## Instagram'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' ig.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium for Playwright
        if: ${{ steps.slot.outputs.pending == 'true' || github.event.inputs.preview == 'true' || github.event.inputs.force == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Build the carousel
        id: build
        if: ${{ steps.slot.outputs.pending == 'true' || github.event.inputs.preview == 'true' || github.event.inputs.force == 'true' }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
        run: |
          PREVIEW="${{ github.event.inputs.preview }}"
          CHOSEN="${{ github.event.inputs.slot }}"
          RESOLVED="${{ steps.slot.outputs.slot }}"
          SLOT_ARG=""
          if [ "$PREVIEW" = "true" ]; then
            case "$CHOSEN" in
              midday|evening|ai|news) SLOT="$CHOSEN" ;;
              *) SLOT="evening" ;;
            esac
            SLOT_ARG="--preview --require-generated --slot $SLOT"
          elif [ -n "$RESOLVED" ]; then
            SLOT_ARG="--slot $RESOLVED"
          fi
          REQUIRE=""
          if [ "$PREVIEW" != "true" ] && { [ "$AUTOMATED" = "true" ] || [ "${{ github.event.inputs.publish }}" = "true" ]; }; then
            REQUIRE="--require-generated"
          fi
          node pipeline/build-carousel.js \
            --spec "${{ github.event.inputs.spec || 'pipeline/specs/carousel-hindi.json' }}" \
            ${{ github.event.inputs.no_photos == 'true' && '--no-photos' || '' }} \
            ${{ github.event.inputs.generate != 'false' && '--generate' || '' }} \
            $SLOT_ARG \
            $REQUIRE \
            2>&1 | tee carousel.log
          {
            echo '## Carousel'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' carousel.log
            echo '```'
            echo '```json'
            cat pipeline/out/carousel-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What would be posted
        if: env.AUTOMATED != 'true' && github.event.inputs.publish != 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: |
          node pipeline/publish-carousel.js --report pipeline/out/carousel-report.json 2>&1 | tee dry.log || true
          {
            echo '## Dry run'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' dry.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Either finance slot may publish. A story is attached only to the evening post.
      - name: Publish to Instagram
        id: publish
        if: ${{ github.event.inputs.preview != 'true' && ((steps.slot.outputs.pending == 'true' && (env.AUTOMATED == 'true' || github.event.inputs.publish == 'true')) || github.event.inputs.force == 'true') }}
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node pipeline/publish-carousel.js --report pipeline/out/carousel-report.json --yes 2>&1 | tee publish.log
          {
            echo '## Published'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Facebook is a copy of a post that is already live. It never runs unless
      # the Instagram publish succeeded, and it can never fail this job.
      - name: Copy to the Facebook Page
        if: ${{ always() && steps.publish.outcome == 'success' && vars.FB_CROSSPOST == 'true' }}
        continue-on-error: true
        env:
          FB_CROSSPOST: ${{ vars.FB_CROSSPOST }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          ID=$(jq -r '.mediaId // empty' pipeline/out/hosted.json 2>/dev/null || true)
          node pipeline/fb-crosspost.js --kind carousel --ig-media "$ID" \
            --hosted pipeline/out/hosted.json --caption-file pipeline/out/caption.txt 2>&1 | tee fb.log
          sed -e 's/\x1b\[[0-9;]*m//g' fb.log >> "$GITHUB_STEP_SUMMARY"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/fb-crosspost-history.json
          git diff --cached --quiet && exit 0
          git commit -m "Record $(date -u +'%Y-%m-%d %H:%M') Facebook cross-post"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          echo "Could not record the Facebook cross-post." >> "$GITHUB_STEP_SUMMARY"

      - name: Remember this post's topic
        if: steps.publish.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/carousel-history.json
          git diff --cached --quiet && { echo "No new topic to record."; exit 0; }
          git commit -m "Record $(date -u +'%Y-%m-%d %H:%M') carousel topic"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          echo "Could not record the topic -- the next run may repeat it." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel
          path: |
            pipeline/out/slides
            pipeline/out/story
            pipeline/out/spec-generated.json
            pipeline/out/caption.txt
            pipeline/out/carousel-report.json
          retention-days: 14
          if-no-files-found: warn

      - name: How the account is doing
        if: always()
        continue-on-error: true
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: |
          node pipeline/audit.js 2>&1 | tee audit.log || true
          {
            echo '## Audit'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Why the build failed
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          echo '--- build failed, last lines ---'
          sed -e 's/\x1b\[[0-9;]*m//g' carousel.log | tail -n 25

      - name: Why the publish failed
        if: ${{ failure() && steps.publish.outcome == 'failure' }}
        run: |
          echo '--- publish failed, last lines ---'
          sed -e 's/\x1b\[[0-9;]*m//g' publish.log | tail -n 20

      - name: Did the story go up?
        if: ${{ always() && steps.publish.outcome != 'skipped' }}
        run: |
          echo '--- story ---'
          sed -e 's/\x1b\[[0-9;]*m//g' publish.log \
            | sed -n '/^Story$/,$p' \
            | head -n 15
          echo '--- end story ---'
