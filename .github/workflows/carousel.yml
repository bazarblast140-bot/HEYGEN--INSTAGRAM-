name: Build carousel

# Separate from build-reel.yml on purpose. The reel job is working and this is a
# new feature; sharing a workflow would mean a change here can break the post
# that already goes out.
#
# No schedule yet. Nothing publishes, so a scheduled run would only fill the
# artifact list — the cron goes on once publishing is wired and verified.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Carousel spec to build
        default: pipeline/specs/carousel-hindi.json
      no_photos:
        description: Skip Pexels, use the generated gradient
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Answers "is the script key live?" without spending a token. It is here
      # rather than in the reel job because that job's failure mode is a whole
      # silent reel; this one just prints the vendor's own verdict.
      - name: Check the script-writing keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          node pipeline/script-doctor.js 2>&1 | tee script.log
          {
            echo '## Script providers'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' script.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The bundled Devanagari face is a hard requirement, not a nicety. The
      # renderer now forces every declared @font-face to load before it measures
      # anything, so a missing or corrupt font fails this step loudly instead of
      # shipping tofu that is only visible once the image is on Instagram.
      - name: Build the carousel
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          node pipeline/build-carousel.js \
            --spec "${{ github.event.inputs.spec || 'pipeline/specs/carousel-hindi.json' }}" \
            ${{ github.event.inputs.no_photos == 'true' && '--no-photos' || '' }} \
            2>&1 | tee carousel.log
          {
            echo '## Carousel'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' carousel.log
            echo '```'
            echo '```json'
            cat pipeline/out/carousel-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel
          path: |
            pipeline/out/slides
            pipeline/out/caption.txt
            pipeline/out/carousel-report.json
          retention-days: 14
          if-no-files-found: warn
