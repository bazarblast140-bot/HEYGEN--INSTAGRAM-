name: Build carousel

# Separate from build-reel.yml on purpose. The reel job is working and this is a
# new feature; sharing a workflow would mean a change here can break the post
# that already goes out.
#
# Still no schedule. Publishing now exists but it is opt-in per run, and a cron
# that builds without posting only fills the artifact list. The cron goes on once
# one carousel has actually gone out by hand and looked right on the feed.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Carousel spec to build
        default: pipeline/specs/carousel-hindi.json
      no_photos:
        description: Skip Pexels, use the generated gradient
        type: boolean
        default: false
      generate:
        description: Write today's topic with the model (off = the checked-in spec)
        type: boolean
        default: true
      publish:
        description: "POST IT TO INSTAGRAM — this is public and cannot be undone"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # contents: write is for the release the slides are hosted on -- Instagram
    # fetches each image from a public URL and never accepts an upload.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Answers "is the script key live?" without spending a token. It is here
      # rather than in the reel job because that job's failure mode is a whole
      # silent reel; this one just prints the vendor's own verdict.
      - name: Check the script-writing keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          node pipeline/script-doctor.js 2>&1 | tee script.log
          {
            echo '## Script providers'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' script.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Read-only. It resolves the configured IG_USER_ID against the token and
      # prints whose account it is -- publishing nothing. "The token is set" and
      # "the token still works" are different facts, and a Facebook-surface token
      # expires; finding that out at post time means a missed day.
      - name: Check the Instagram token
        continue-on-error: true
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: |
          node pipeline/instagram-doctor.js 2>&1 | tee ig.log || true
          {
            echo '## Instagram'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' ig.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The bundled Devanagari face is a hard requirement, not a nicety. The
      # renderer now forces every declared @font-face to load before it measures
      # anything, so a missing or corrupt font fails this step loudly instead of
      # shipping tofu that is only visible once the image is on Instagram.
      - name: Build the carousel
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
        run: |
          node pipeline/build-carousel.js \
            --spec "${{ github.event.inputs.spec || 'pipeline/specs/carousel-hindi.json' }}" \
            ${{ github.event.inputs.no_photos == 'true' && '--no-photos' || '' }} \
            ${{ github.event.inputs.generate != 'false' && '--generate' || '' }} \
            2>&1 | tee carousel.log
          {
            echo '## Carousel'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' carousel.log
            echo '```'
            echo '```json'
            cat pipeline/out/carousel-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # publish off: show what would go out -- which account, which files, the
      # caption in full -- and post nothing. Cheap, and it catches a caption that
      # got mangled or a token that resolves to the wrong account, at the point
      # where that is still free to fix.
      - name: What would be posted
        if: github.event.inputs.publish != 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
        run: |
          node pipeline/publish-carousel.js --report pipeline/out/carousel-report.json 2>&1 | tee dry.log || true
          {
            echo '## Dry run'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' dry.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The only step in this workflow that is visible to anyone but us, and the
      # only one that cannot be undone from here -- a wrong post is deleted by
      # hand, from the phone, after people have seen it. So it runs when it is
      # asked for and never by default.
      - name: Publish to Instagram
        if: github.event.inputs.publish == 'true'
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node pipeline/publish-carousel.js --report pipeline/out/carousel-report.json --yes 2>&1 | tee publish.log
          {
            echo '## Published'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel
          path: |
            pipeline/out/slides
            pipeline/out/spec-generated.json
            pipeline/out/caption.txt
            pipeline/out/carousel-report.json
          retention-days: 14
          if-no-files-found: warn
