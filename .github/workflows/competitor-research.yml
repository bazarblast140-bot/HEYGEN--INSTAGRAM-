name: Competitor research

# Public Instagram patterns only. Does not publish and does not change the
# carousel or reel schedules. 05:30 IST is 00:00 UTC.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect public patterns
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node pipeline/research.js
      - name: Commit trends and the Sunday report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json reports
          git diff --cached --quiet && { echo "No trend changes."; exit 0; }
          git commit -m "Record competitor patterns $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          echo "Could not push trends." >> "$GITHUB_STEP_SUMMARY"
          exit 1
