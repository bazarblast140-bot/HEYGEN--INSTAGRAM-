name: Set up Instagram token

# Run this once. It turns the short-lived token from the Graph API Explorer into a
# Page token that does not expire, then stores that token as the repository
# secret IG_ACCESS_TOKEN.
#
# The token is masked and never uploaded. On a public repository any logged-in
# user can download Actions artifacts, so a file is not a safe handoff.

on:
  workflow_dispatch:
    inputs:
      short_lived_token:
        description: Paste the token from Graph API Explorer (used once, not stored)
        required: true

permissions:
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Exchange and store the Page token
        env:
          SHORT_LIVED: ${{ github.event.inputs.short_lived_token }}
          FB_APP_ID: ${{ vars.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${SHORT_LIVED}" ]; then
            printf '%s\n' "::add-mask::${SHORT_LIVED}"
          fi
          node --input-type=module -e '
            import { exchangeForLongLived, pageToken, inspect } from "./pipeline/src/publish/token.js";
            import { spawn } from "node:child_process";

            const secrets = [];
            const mask = (value) => {
              if (!value || secrets.includes(value)) return;
              secrets.push(value);
              process.stdout.write("::add-mask::" + value + "\n");
            };
            const redact = (text) => secrets.reduce((out, secret) => out.split(secret).join("***"), String(text));

            try {
              const short = process.env.SHORT_LIVED || "";
              mask(short);
              const long = await exchangeForLongLived({
                token: short,
                appId: process.env.FB_APP_ID,
                appSecret: process.env.FB_APP_SECRET,
              });
              mask(long.token);

              let final = long.token;
              let kind = "long-lived user token (" + Math.round((long.expiresIn || 0) / 86400) + " days)";
              if (process.env.FB_PAGE_ID) {
                try {
                  const page = await pageToken({ token: long.token, pageId: process.env.FB_PAGE_ID });
                  mask(page.token);
                  final = page.token;
                  kind = "page token for " + page.name;
                } catch (err) {
                  console.log("page token step skipped: " + redact(err.message));
                }
              }
              mask(final);

              const info = await inspect({ token: final }).catch(() => null);
              console.log("result: " + kind + (info ? ", expires " + info.expiresAt : ""));

              const child = spawn("gh", ["secret", "set", "IG_ACCESS_TOKEN", "--repo", process.env.GITHUB_REPOSITORY], {
                stdio: ["pipe", "inherit", "pipe"],
              });
              let errText = "";
              child.stderr.on("data", (buf) => { errText += buf; });
              child.stdin.end(final);
              const code = await new Promise((resolve, reject) => {
                child.on("error", reject);
                child.on("close", resolve);
              });
              if (code !== 0) {
                console.error("Could not store IG_ACCESS_TOKEN as a repository secret.");
                console.error(redact(errText).trim());
                process.exit(1);
              }
              console.log("Stored as repository secret IG_ACCESS_TOKEN.");
            } catch (err) {
              console.error(redact(err && err.message ? err.message : err));
              process.exit(1);
            }
          '

      - name: What to do next
        if: success()
        run: |
          {
            echo "## Token stored"
            echo "The Page token is now the repository secret **IG_ACCESS_TOKEN**."
            echo "It was not printed and it was not uploaded."
          } >> "$GITHUB_STEP_SUMMARY"
